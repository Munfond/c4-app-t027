services:
  backend:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      APP_ENV: development
      NUSC_ROOT: /app/data/nuscenes
      LAB_DATA_ROOT: /app/data/lab
      SIM_DATA_ROOT: /app/data/sim
      ANONYMIZER_ENABLED: "false"
      LANGCHAIN_TRACING_V2: "false"
    volumes:
      - ./data:/app/data:ro
    restart: unless-stopped
