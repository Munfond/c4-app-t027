name: Sync Upstream Main

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    name: Sync code from organization repo
    if: github.repository == 'Munfond/c4-app-t027'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout mirror repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_PAT }}

      - name: Fetch and Merge from Upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/AI20K-Build-Phase-Cohort-4/P-027.git
          git fetch upstream main
          git checkout main
          # Preserve mirror deployment fixes; stop on conflicts instead of overwriting.
          git merge --no-edit upstream/main
          git push origin main
