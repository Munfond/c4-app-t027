name: Sync Upstream Main

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    name: Sync code from organization repo
    if: github.repository == 'Munfond/c4-app-t027'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout mirror repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ github.token }}
          path: mirror

      - name: Checkout private upstream
        uses: actions/checkout@v4
        with:
          repository: AI20K-Build-Phase-Cohort-4/P-027
          ref: main
          fetch-depth: 0
          token: ${{ secrets.SYNC_PAT }}
          path: upstream
          persist-credentials: false

      - name: Fetch and Merge from Upstream
        working-directory: mirror
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # SYNC_PAT only reads the private source; GITHUB_TOKEN writes this mirror.
          git remote add upstream ../upstream
          git fetch upstream main
          git checkout main
          # Preserve mirror deployment fixes; stop on conflicts instead of overwriting.
          git merge --no-edit upstream/main
          git push origin main
