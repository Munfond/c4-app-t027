name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A single team runner should spend time on the latest PR revision.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: powershell

jobs:
  backend:
    # Phoenix team runner: team-27-Munfond (Windows x64).
    runs-on: [self-hosted, Windows, X64, team-27]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      # Real replay/worker tests execute the occupancy checkpoint on CPU.
      # Keep this out of the lightweight production web image; no CUDA required.
      - run: python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m ruff check src/ tests/
      - run: python -m pytest tests/ -v --tb=short
        env:
          APP_ENV: test
          LANGCHAIN_TRACING_V2: "false"
  frontend:
    runs-on: [self-hosted, Windows, X64, team-27]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
